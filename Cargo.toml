[workspace]
members = ["cli", "crypto/*", "mem_usage_benches"]

[workspace.package]
edition = "2024"
# `bouncycastle-utils` uses `slice::as_chunks`, stable since 1.88; the 2024 edition alone needs 1.85.
rust-version = "1.88"
version = "0.1.4"

[workspace.dependencies]

# *** Internal Dependencies ***
bouncycastle = { path = "./", default-features = false }
bouncycastle-symmetric = { path = "./crypto/symmetric", default-features = false }
bouncycastle-digest = { path = "./crypto/digest", default-features = false }
bouncycastle-core = { path = "crypto/core", default-features = false }
bouncycastle-cipher-test-framework = { path = "./crypto/cipher-test-framework" }
bouncycastle-core-test-framework = { path = "./crypto/core-test-framework" }
bouncycastle-ec = { path = "./crypto/ec", default-features = false }
bouncycastle-hybrid = { path = "./crypto/hybrid", default-features = false }
bouncycastle-modexp = { path = "./crypto/modexp", default-features = false }
bouncycastle-pqc = { path = "./crypto/pqc", default-features = false }
bouncycastle-rng = { path = "./crypto/rng" }
bouncycastle-utils = { path = "./crypto/utils" }


# *** External Dependencies ***
criterion = "0.8.2" # only for benchmarking, not used in lib or cli build

[profile.release]
lto = "thin"
strip = "debuginfo"

# For `cargo mutants --profile mutants`: optimised like release, so the ML-DSA/ML-KEM suites run
# in seconds rather than minutes, but without LTO and with incremental codegen, so each mutant's
# rebuild of one crate and its test binaries takes seconds rather than the full release link.
[profile.mutants]
inherits = "release"
lto = false
incremental = true
codegen-units = 16


# libbouncycastle
[package]
name = "bouncycastle"
version.workspace = true
edition.workspace = true

# `alloc` turns on the `alloc` feature of every library crate, and with it the one-shots that
# return a `Vec` and the `_boxed` finals of the worker traits. `std`, on by default, implies it,
# turns on their `std`, and adds `bouncycastle-rng`, which seeds from the operating system and so
# cannot do without `std`. With neither the crate is a `no_std` build that links no allocator.
[features]
default = ["std"]
std = [
    "alloc",
    "dep:bouncycastle-rng",
    "bouncycastle-core/std",
    "bouncycastle-digest/std",
    "bouncycastle-symmetric/std",
    "bouncycastle-ec/std",
    "bouncycastle-pqc/std",
    "bouncycastle-modexp/std",
    "bouncycastle-hybrid/std",
]
alloc = [
    "bouncycastle-core/alloc",
    "bouncycastle-digest/alloc",
    "bouncycastle-symmetric/alloc",
    "bouncycastle-ec/alloc",
    "bouncycastle-pqc/alloc",
    "bouncycastle-modexp/alloc",
    "bouncycastle-hybrid/alloc",
]

[dependencies]
bouncycastle-symmetric.workspace = true
bouncycastle-digest.workspace = true
bouncycastle-core.workspace = true
bouncycastle-ec.workspace = true
bouncycastle-hybrid.workspace = true
bouncycastle-modexp.workspace = true
bouncycastle-pqc.workspace = true
bouncycastle-rng = { workspace = true, optional = true }
