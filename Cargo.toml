[workspace]
members = ["cli", "crypto/*", "mem_usage_benches"]

[workspace.package]
edition = "2024"
# `bouncycastle-utils` uses `slice::as_chunks`, stable since 1.88; the 2024 edition alone needs 1.85.
rust-version = "1.88"
version = "0.1.4"

[workspace.dependencies]

# *** Internal Dependencies ***
bouncycastle = { path = "./" }
bouncycastle-aes = { path = "./crypto/aes" }
bouncycastle-camellia = { path = "./crypto/camellia" }
bouncycastle-aria = { path = "./crypto/aria" }
bouncycastle-ascon = { path = "./crypto/ascon" }
bouncycastle-base64 = { path = "./crypto/base64" }
bouncycastle-blake2 = { path = "./crypto/blake2" }
bouncycastle-blake3 = { path = "./crypto/blake3" }
bouncycastle-chacha20 = { path = "./crypto/chacha20" }
bouncycastle-chacha20-poly1305-aead = { path = "./crypto/chacha20-poly1305-aead" }
bouncycastle-cipher = { path = "./crypto/cipher" }
bouncycastle-concatkdf = { path = "./crypto/concatkdf" }
bouncycastle-core = { path = "crypto/core" }
bouncycastle-cipher-test-framework = { path = "./crypto/cipher-test-framework" }
bouncycastle-core-test-framework = { path = "./crypto/core-test-framework" }
bouncycastle-ec = { path = "./crypto/ec" }
bouncycastle-eccdh = { path = "./crypto/eccdh" }
bouncycastle-ecdsa = { path = "./crypto/ecdsa" }
bouncycastle-factory = { path = "./crypto/factory" }
bouncycastle-hex = { path = "./crypto/hex" }
bouncycastle-hkdf = { path = "./crypto/hkdf" }
bouncycastle-hmac = { path = "./crypto/hmac" }
bouncycastle-mlkem = { path = "./crypto/mlkem" }
bouncycastle-mlkem-common = { path = "./crypto/mlkem-common" }
bouncycastle-mlkem-lowmemory = { path = "./crypto/mlkem-lowmemory" }
bouncycastle-mldsa = { path = "./crypto/mldsa" }
bouncycastle-mldsa-common = { path = "./crypto/mldsa-common" }
bouncycastle-mldsa-lowmemory = { path = "./crypto/mldsa-lowmemory" }
bouncycastle-poly1305 = { path = "./crypto/poly1305" }
bouncycastle-rng = { path = "./crypto/rng" }
bouncycastle-rsa = { path = "./crypto/rsa" }
bouncycastle-sha2 = { path = "./crypto/sha2" }
bouncycastle-sha3 = { path = "./crypto/sha3" }
bouncycastle-sm2 = { path = "./crypto/sm2" }
bouncycastle-sm3 = { path = "./crypto/sm3" }
bouncycastle-sm4 = { path = "./crypto/sm4" }
bouncycastle-utils = { path = "./crypto/utils" }
bouncycastle-x963kdf = { path = "./crypto/x963kdf" }


# *** External Dependencies ***
criterion = "0.8.2" # only for benchmarking, not used in lib or cli build

[profile.release]
lto = "thin"
strip = "debuginfo"

# For `cargo mutants --profile mutants`: optimised like release, so the ML-DSA/ML-KEM suites run
# in seconds rather than minutes, but without LTO and with incremental codegen, so each mutant's
# rebuild of one crate and its test binaries takes seconds rather than the full release link.
[profile.mutants]
inherits = "release"
lto = false
incremental = true
codegen-units = 16


