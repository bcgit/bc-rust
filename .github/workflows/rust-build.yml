name: Rust Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features

      # --all-features above never builds a crate with a default feature off. scrypt without
      # `std` is its caller-supplied-memory configuration, and it once did not compile.
      - name: Test bouncycastle-digest without std
        # The vector suites need bc-test-data, which this job does not check out.
        run: cargo test -p bouncycastle-digest --no-default-features --lib --test scrypt_scrypt_caller_memory_tests
