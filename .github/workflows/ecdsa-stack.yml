name: ECDSA Stack Wipe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ecdsa-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ecdsa-stack:
    if: github.repository == 'bcgit/bc-rust'
    name: ecdsa-stack (${{ matrix.runner }})
    # The wipes are sized by measurement, and the two targets lay their frames out differently.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Search the stack ECDSA, ECC CDH, DHKEM and EdDSA/XDH used for what they handled
        run: ./dev_scripts/check_ecdsa_stack.sh
