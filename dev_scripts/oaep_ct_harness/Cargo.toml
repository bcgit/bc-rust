# The EME-OAEP decoding, out of line, for `../check_oaep_ct.sh` to read the assembly of and to
# run under memcheck. Its own workspace, so the root `cargo build --workspace` never builds it.
[package]
name = "oaep_ct_harness"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bouncycastle-utils = { path = "../../crypto/utils" }
# eme_oaep.rs names two traits of bouncycastle-core; the stub supplies them under that name,
# reduced to what that file uses, so the harness's hash need not implement the rest of `Hash`.
bouncycastle-core = { package = "oaep_ct_stub_core", path = "stub_core" }

[profile.release]
debug = 1

[workspace]
