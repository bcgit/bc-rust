name: AES Constant-Time Assembly

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aes-ct-asm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aes-ct-asm:
    name: aes-ct-asm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install nightly with rust-src
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install nightly --profile minimal --component rust-src

      - name: Check the round-key widening assembly on Cortex-M0 and RISC-V 32I
        run: ./dev_scripts/check_aes_ct_asm.sh
