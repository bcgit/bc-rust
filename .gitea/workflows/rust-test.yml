name: Rust Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The runner mounts its synced copies read-only at /bc-test-data and /wycheproof, so the
      # data is not transferred per build. The vector suites print a warning and pass when their
      # data is missing, and Docker mounts an empty directory for a missing host path, so check
      # for the directory the loaders read rather than the mount point.
      - name: Symlink bc-test-data alongside the checkout
        run: |
          test -d /bc-test-data/crypto || { echo "/bc-test-data/crypto not found"; exit 1; }
          ln -sfnT /bc-test-data ../bc-test-data

      # GitHub's workflow checks Wycheproof out at a fixed commit, so that a change upstream does
      # not fail an unrelated pull request. The mount cannot be checked out, but a clone holds
      # every commit it has fetched: the vectors of the pinned commit are read out of the
      # runner's clone, wherever its HEAD is. Keep WYCHEPROOF_COMMIT in step with the `ref` in
      # .github/workflows/rust-test.yml; the runner's clone needs a fetch only when the pin moves
      # past what it holds.
      - name: Extract the pinned Wycheproof vectors alongside the checkout
        env:
          WYCHEPROOF_COMMIT: 65ca494727a52944c204441c860b039e6786b99b
        run: |
          # The mount belongs to another user, which git refuses without safe.directory.
          wy() { git -c safe.directory=/wycheproof -C /wycheproof "$@"; }
          wy rev-parse --git-dir >/dev/null || {
            echo "/wycheproof is not a git clone, so the pinned commit cannot be read from it"; exit 1;
          }
          wy cat-file -e "$WYCHEPROOF_COMMIT^{commit}" || {
            echo "/wycheproof does not hold commit $WYCHEPROOF_COMMIT; fetch it on the runner"; exit 1;
          }
          # A link left by an earlier job is removed, not followed.
          rm -rf ../wycheproof
          mkdir ../wycheproof
          # The loaders read testvectors_v1 only. Through a file, so that a failed archive is
          # this step's failure and not hidden by a pipe.
          tarball=$(mktemp)
          wy archive --format=tar -o "$tarball" "$WYCHEPROOF_COMMIT" testvectors_v1
          tar -xf "$tarball" -C ../wycheproof
          rm -f "$tarball"
          test -d ../wycheproof/testvectors_v1 || { echo "no testvectors_v1 in $WYCHEPROOF_COMMIT"; exit 1; }

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run tests
        run: cargo test --all
