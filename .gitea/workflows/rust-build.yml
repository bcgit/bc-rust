name: Rust Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features

      # --all-features above never builds a crate with a default feature off. Each library crate
      # is `#![no_std]`, and with `-p` nothing else turns a feature on, so an item that needs
      # `std` or `alloc` and is not behind its feature fails here. This is the host target, where
      # `extern crate std` still resolves; the nightly job in aes-ct-asm.yml checks a bare-metal
      # one, where it does not.
      - name: Check the library crates without std
        run: |
          for crate in utils core digest symmetric ec pqc modexp hybrid rng; do
            cargo check -p "bouncycastle-$crate" --no-default-features
          done
          for crate in core digest symmetric ec pqc modexp hybrid rng; do
            cargo check -p "bouncycastle-$crate" --no-default-features --features alloc
          done

      - name: Test bouncycastle-core without std
        run: |
          cargo test -p bouncycastle-core --no-default-features
          cargo test -p bouncycastle-core --no-default-features --features alloc

      # Without `std` the DRBG is seeded by the caller: nothing here draws from the OS.
      - name: Test bouncycastle-rng without std
        # The CAVP suite needs bc-test-data, which this job does not check out, and skips.
        run: |
          cargo test -p bouncycastle-rng --no-default-features
          cargo test -p bouncycastle-rng --no-default-features --features alloc

      # scrypt without `alloc` is its caller-supplied-memory configuration, and it once did not
      # compile.
      - name: Test bouncycastle-digest without std
        # The vector suites need bc-test-data, which this job does not check out.
        # Every target is built first, so that one that stops compiling without std is seen.
        run: |
          cargo test -p bouncycastle-digest --no-default-features --no-run
          cargo test -p bouncycastle-digest --no-default-features --lib --test scrypt_scrypt_caller_memory_tests
