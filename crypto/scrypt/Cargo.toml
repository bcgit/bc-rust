[package]
name = "bouncycastle-scrypt"
version.workspace = true
edition.workspace = true

[features]
# `std` gates the [`KDF`] and `KdfDescription` impls, which allocate the working memory; without
# it the crate is the caller-supplied-memory function alone. That is a narrower API, not yet a
# `no_std` build: `bouncycastle-core`, `hmac` and `sha2` still link `std`, and the forwarding
# below changes nothing while the workspace dependency on `core` keeps its default features.
default = ["std"]
std = ["bouncycastle-core/std"]

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-pbkdf2.workspace = true
bouncycastle-sha2.workspace = true
bouncycastle-utils.workspace = true

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
bouncycastle-hex.workspace = true
criterion.workspace = true

# The trait-path tests; `scrypt_caller_memory_tests` runs with and without `std`.
[[test]]
name = "scrypt_tests"
required-features = ["std"]

[[bench]]
name = "scrypt_benches"
harness = false
