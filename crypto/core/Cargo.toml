[package]
name = "bouncycastle-core"
version.workspace = true
edition.workspace = true

[features]
# `std` gates the ergonomic, allocating (`Vec`- and `Box`-returning) one-shot APIs. It is on by
# default today; a future `--no-default-features` build is what will let `core` become
# `#![no_std]` (see the TODO at the top of `src/lib.rs`). No other crate in the workspace
# builds with it off yet: several override or call the gated methods.
default = ["std"]
std = []

[dependencies]
bouncycastle-utils.workspace = true

[dev-dependencies]
bouncycastle-rng.workspace = true
