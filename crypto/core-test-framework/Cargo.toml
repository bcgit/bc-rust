[package]
name = "bouncycastle-core-test-framework"
version.workspace = true
edition.workspace = true

[features]
# `alloc` enables the `Vec`/`Box`-returning convenience APIs (and turns on the same feature in
# bouncycastle-core). On by default; disable with `default-features = false` for `no_std` use.
default = ["alloc"]
alloc = ["bouncycastle-core/alloc"]

[dependencies]
# The KAT test framework exercises the `Vec`/`Box`-returning trait APIs, so it always needs `alloc`.
bouncycastle-core = { workspace = true, default-features = false }
bouncycastle-hex = { workspace = true, default-features = false }

[dev-dependencies]
