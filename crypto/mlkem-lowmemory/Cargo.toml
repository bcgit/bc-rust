[package]
name = "bouncycastle-mlkem-lowmemory"
version.workspace = true
edition.workspace = true

[features]
# `alloc` enables the `Vec`/`Box`-returning convenience APIs (and turns on the same feature in
# bouncycastle-core). On by default; disable with `default-features = false` for `no_std` use.
default = ["alloc"]
alloc = [
    "bouncycastle-core/alloc",
    "bouncycastle-rng/alloc",
    "bouncycastle-hex/alloc",
    "bouncycastle-sha3/alloc",
    "bouncycastle-core-test-framework/alloc",
]

[dependencies]
bouncycastle-core = { workspace = true, default-features = false }
bouncycastle-sha3 = { workspace = true, default-features = false }
bouncycastle-rng = { workspace = true, default-features = false }
bouncycastle-utils.workspace = true

[dev-dependencies]
bouncycastle-core-test-framework = { workspace = true, default-features = false }
bouncycastle-hex = { workspace = true, default-features = false }
criterion.workspace = true
serde_json = "1.0"

[[bench]]
name = "mlkem_benches"
harness = false
