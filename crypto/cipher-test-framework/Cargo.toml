[package]
name = "bouncycastle-cipher-test-framework"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# The suites use the `Vec` one-shots.
bouncycastle-core = { workspace = true, features = ["std"] }
bouncycastle-core-test-framework.workspace = true
# The suites draw IVs and nonces from a DRBG seeded by the operating system.
bouncycastle-rng = { workspace = true, features = ["std"] }
bouncycastle-symmetric.workspace = true
