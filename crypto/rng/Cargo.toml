[package]
name = "bouncycastle-rng"
version.workspace = true
edition.workspace = true

[dependencies]
bouncycastle-core.workspace = true
# By path, not from the workspace table, to leave the default `std` feature off:
# `bouncycastle-digest` dev-depends on this crate, and a default-featured edge back to it would
# turn `std` on in its own `--no-default-features` test build.
bouncycastle-digest = { path = "../digest", default-features = false }
bouncycastle-utils.workspace = true

# external
getrandom = "0.4.0-rc.1"

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
criterion.workspace = true

[[bench]]
name = "hash_drbg_benches"
harness = false
