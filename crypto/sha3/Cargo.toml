[package]
name = "bouncycastle-sha3"
version.workspace = true
edition.workspace = true

[features]
# `std` gates the one-shots that return a `Vec`; everything else is the same without it.
default = ["std"]
std = ["bouncycastle-core/std"]

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-hmac.workspace = true
bouncycastle-utils.workspace = true

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
bouncycastle-rng.workspace = true
criterion.workspace = true

[[bench]]
name = "sha3_benches"
harness = false

[[bench]]
name = "hmac_sha3_benches"
harness = false
