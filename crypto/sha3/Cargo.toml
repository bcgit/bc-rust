[package]
name = "bouncycastle-sha3"
version = "0.1.1"
edition.workspace = true

[features]
# `alloc` enables the `Vec`/`Box`-returning convenience APIs (and turns on the same feature in
# bouncycastle-core). On by default; disable with `default-features = false` for `no_std` use.
default = ["alloc"]
alloc = ["bouncycastle-core/alloc"]

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-utils.workspace = true

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
criterion.workspace = true
bouncycastle-hex.workspace = true
bouncycastle-rng.workspace = true

[[bench]]
name = "sha3_benches"
harness = false
