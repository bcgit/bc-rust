[package]
name = "bouncycastle-cipher"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-rng.workspace = true
bouncycastle-utils.workspace = true

[features]
# On by default: GCM's GHASH uses `PMULL` where the target and the CPU have it. Off, the
# portable multiplier only, and the asm crate is not built.
default = ["asm"]
asm = ["dep:bouncycastle-asm"]

# The PMULL GHASH multiply behind GCM's `ghash` module. Empty unless the build declares the
# instructions or targets an operating system the asm crate can ask.
[target.'cfg(all(target_arch = "aarch64", target_endian = "little"))'.dependencies]
bouncycastle-asm = { workspace = true, optional = true }

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
bouncycastle-hex.workspace = true
criterion.workspace = true

[[test]]
name = "nopadding_tests"
path = "tests/padding/nopadding_tests.rs"

[[test]]
name = "padded_tests"
path = "tests/padding/padded_tests.rs"

[[test]]
name = "pkcs7_tests"
path = "tests/padding/pkcs7_tests.rs"

[[test]]
name = "alg_name_tests"
