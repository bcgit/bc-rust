[package]
name = "bouncycastle-aes"
version.workspace = true
edition.workspace = true

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-utils.workspace = true
bouncycastle-cipher.workspace = true

[features]
# On AArch64 builds that do not declare `aes`, detect the Crypto Extensions at run time and use
# them where present, for the AES engine (`hazmat::engine::Detected`) and for GCM's GHASH. No
# effect elsewhere.
std = ["bouncycastle-arm/std", "bouncycastle-cipher/std"]

# The AArch64 Crypto Extensions engine; see `hazmat::engine`. Empty unless the build declares
# the instructions or enables `std`.
[target.'cfg(all(target_arch = "aarch64", target_endian = "little"))'.dependencies]
bouncycastle-arm.workspace = true

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
bouncycastle-hex.workspace = true
bouncycastle-rng.workspace = true
criterion.workspace = true

[[bench]]
name = "aes_benches"
harness = false

[[bench]]
name = "aes_modes_benches"
harness = false

[[bench]]
name = "aes_gcm_packet_benches"
harness = false
