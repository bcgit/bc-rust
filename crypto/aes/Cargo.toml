[package]
name = "bouncycastle-aes"
version.workspace = true
edition.workspace = true

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-utils.workspace = true
bouncycastle-cipher.workspace = true

# The AArch64 Crypto Extensions engine; see `hazmat::engine`. Linked only into builds that
# declare the instructions, so every other target neither compiles nor depends on it.
[target.'cfg(all(target_arch = "aarch64", target_feature = "aes"))'.dependencies]
bouncycastle-arm.workspace = true

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
bouncycastle-hex.workspace = true
bouncycastle-rng.workspace = true
criterion.workspace = true

[[bench]]
name = "aes_benches"
harness = false

[[bench]]
name = "aes_modes_benches"
harness = false

[[bench]]
name = "aes_gcm_packet_benches"
harness = false
