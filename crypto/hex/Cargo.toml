[package]
name = "bouncycastle-hex"
version.workspace = true
edition.workspace = true

[features]
# `std` gates `encode` and `decode`, which return a `String` and a `Vec`; the `_out` forms need
# no allocator.
default = ["std"]
std = []

[dependencies]
bouncycastle-utils.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "hex_benches"
harness = false
