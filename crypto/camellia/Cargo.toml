[package]
name = "bouncycastle-camellia"
version.workspace = true
edition.workspace = true

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-utils.workspace = true
# The modes the keys hand out, the `ModeNames` impls and the `Camellia_*` aliases; the engines
# themselves do not use it.
bouncycastle-cipher.workspace = true

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
bouncycastle-hex.workspace = true
bouncycastle-rng.workspace = true
criterion.workspace = true
serde_json = "1.0"

[[bench]]
name = "camellia_benches"
harness = false
