[package]
name = "bouncycastle-hkdf"
version.workspace = true
edition.workspace = true

[features]
# `alloc` enables the `Box<dyn KeyMaterialTrait>`-returning `derive_key`/`derive_key_from_multiple`.
# Forwarded to every internal dependency to keep the `alloc` gates consistent across the graph.
# On by default; disable with `default-features = false` for `no_std` use.
default = ["alloc"]
alloc = [
    "bouncycastle-core/alloc",
    "bouncycastle-hmac/alloc",
    "bouncycastle-sha2/alloc",
    "bouncycastle-hex/alloc",
    "bouncycastle-rng/alloc",
    "bouncycastle-core-test-framework/alloc",
]

[dependencies]
bouncycastle-core = { workspace = true, default-features = false }
bouncycastle-hmac = { workspace = true, default-features = false }
bouncycastle-sha2 = { workspace = true, default-features = false }
bouncycastle-utils.workspace = true

[dev-dependencies]
bouncycastle-core-test-framework = { workspace = true, default-features = false }
criterion.workspace = true
bouncycastle-rng = { workspace = true, default-features = false }
bouncycastle-hex = { workspace = true, default-features = false }

[[bench]]
name = "hkdf_benches"
harness = false
