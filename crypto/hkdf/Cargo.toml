[package]
name = "bouncycastle-hkdf"
version.workspace = true
edition.workspace = true

[features]
default = ["alloc"]
alloc = [
    "bouncycastle-core/alloc",
    "bouncycastle-core-test-framework/alloc",
    "bouncycastle-hmac/alloc",
    "bouncycastle-rng/alloc",
    "bouncycastle-sha2/alloc",
]

[dependencies]
bouncycastle-core = { workspace = true, default-features = false }
bouncycastle-hmac = { workspace = true, default-features = false }
bouncycastle-utils.workspace = true

# The concrete HKDF instantiations (HKDF_SHA256, HKDF_SHA512) live in bouncycastle-sha2, which makes
# that crate depend on this one, so this crate must not depend on it. bouncycastle-sha2 is a
# dev-dependency so that the tests, benches and doc examples here can still exercise HKDF over the
# library's own hashes; Cargo permits cycles through dev-dependencies.
# todo -- we're about to change that and move them to their respective crates in the next phase.
[dev-dependencies]
bouncycastle-core-test-framework = { workspace = true, default-features = false }
criterion.workspace = true
bouncycastle-rng = { workspace = true, default-features = false }
bouncycastle-hex.workspace = true
bouncycastle-sha2 = { workspace = true, default-features = false }
