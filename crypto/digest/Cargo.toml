[package]
name = "bouncycastle-digest"
description = "Hash functions and the MACs and key derivation functions built on them: SHA-2, SHA-3, BLAKE2, RIPEMD, SM3, HMAC, HKDF, PBKDF2, scrypt, the NIST concatenation KDF and the ANSI X9.63 KDF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# `alloc` gates scrypt's [`KDF`] and `KdfDescription` impls, which allocate the working memory, and
# BLAKE3's and SHA-3's `Vec`-returning one-shots, and turns on `bouncycastle-core`'s; without it
# `scrypt` is the caller-supplied-memory function alone, and the crate and what it depends on
# link no allocator. `std` implies `alloc` and gates nothing of its own: it is a forward.
default = ["std"]
std = ["alloc", "bouncycastle-core/std"]
alloc = ["bouncycastle-core/alloc"]

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-utils.workspace = true

[dev-dependencies]
# The tests, benches and doc examples use the `Vec` one-shots.
bouncycastle-core = { workspace = true, features = ["std"] }
bouncycastle-core-test-framework.workspace = true
bouncycastle-rng.workspace = true
criterion.workspace = true

# scrypt's trait-path tests; `scrypt_scrypt_caller_memory_tests` runs with and without `alloc`.
[[test]]
name = "scrypt_scrypt_tests"
required-features = ["alloc"]

# BLAKE3's tests use its `Vec`-returning one-shots.
[[test]]
name = "blake3_blake3_tests"
required-features = ["alloc"]

# These SHA-3 tests use the `Vec`-returning one-shots.
[[test]]
name = "sha3_cshake_tests"
required-features = ["alloc"]

[[test]]
name = "sha3_finish_squeezer_tests"
required-features = ["alloc"]

[[test]]
name = "sha3_kmac_tests"
required-features = ["alloc"]

[[test]]
name = "sha3_parallelhash_bc-test-data"
required-features = ["alloc"]

[[test]]
name = "sha3_parallelhash_tests"
required-features = ["alloc"]

[[test]]
name = "sha3_tuplehash_bc-test-data"
required-features = ["alloc"]

[[test]]
name = "sha3_tuplehash_tests"
required-features = ["alloc"]

